<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Friends</title>
    <!-- Підключення стилів -->
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/modern-normalize/3.0.1/modern-normalize.min.css"
    />
    <link rel="stylesheet" href="../css/friends.css" />

    <!-- Підключення скриптів -->
    <script type="module" src="../js/01-friends.js"></script>
  </head>
  <body>
    <div class="container">
      <h1 class="main-title">Friends</h1>
      <ul class="friends-list js-friends-list">
        <li class="friends-list-item">
          <img class="friend-avatar" src="https://placehold.co/32x32/orange/white?text=LW" alt="Lester Warren" />
          <h2 class="friend-name">Lester Warren</h2>
        </li>
        <li class="friends-list-item">
          <img class="friend-avatar" src="https://placehold.co/32x32/orange/white?text=NG" alt="Nannie Garrett" />
          <h2 class="friend-name">Nannie Garrett</h2>
        </li>
        <li class="friends-list-item">
          <img class="friend-avatar" src="https://placehold.co/32x32/orange/white?text=BM" alt="Bill Moss" />
          <h2 class="friend-name">Bill Moss</h2>
        </li>
        <li class="friends-list-item">
          <img class="friend-avatar" src="https://placehold.co/32x32/orange/white?text=CC" alt="Craig Curry" />
          <h2 class="friend-name">Craig Curry</h2>
        </li>
        <li class="friends-list-item">
          <img class="friend-avatar" src="https://placehold.co/32x32/orange/white?text=AR" alt="Antonio Russell" />
          <h2 class="friend-name">Antonio Russell</h2>
        </li>
        <li class="friends-list-item">
          <img class="friend-avatar" src="https://placehold.co/32x32/orange/white?text=LJ" alt="Lela Jennings" />
          <h2 class="friend-name">Lela Jennings</h2>
        </li>
      </ul>
      <p class="friends-count">Number of friends: <span class="js-friends-count-output"></span></p>
    </div>
  </body>
</html>
